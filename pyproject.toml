[project]
name = "orders-service"
version = "0.1.0"
description = "Proyecto final Python Complete: Servicio de´ordenes"
authors = [
    {name = "Arturo",email = "arturo.humanez@axity.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)"
]

[tool.poetry]
name = "python-complete-course"
version = "0.1.0"
description = "Proyecto final Python Complete: Servicio de´ordenes"
readme = "README.md"
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.16,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "hypothesis (>=6.155.1,<7.0.0)",
    "pip-audit (>=2.10.0,<3.0.0)"
]
